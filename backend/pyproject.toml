[project]
name = "portfolio-backend"
version = "0.1.0"
description = "API for the portfolio site: receives contact form messages, stores them in Postgres and emails them on"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "anthropic>=2.8.0",
    "groq>=1.7.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
